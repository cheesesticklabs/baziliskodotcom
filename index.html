<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Bazilisko</title>
<link rel="icon" type="image/png" href="bazilisko.png">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #fff; }
main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: clamp(8px, 2vh, 24px); }
img { display: block; height: auto; object-fit: contain; }
.logo { width: min(85vw, 58vh, 650px); width: min(85vw, 58svh, 650px); }
.nameplate { width: min(88vw, 1000px, 135vh); }
</style>
</head>
<body>
<main aria-label="Bazilisko">
<img class="logo" src="bazilisko.png" alt="Crowned blue basilisk" width="500" height="500">
<img class="nameplate" src="nameplate.png" alt="BAZILISKO" width="849" height="173">
</main>
</body>
</html>
